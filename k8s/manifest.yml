apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: k8s-program
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-program
data:
  RESOURCES_MS_NAME: "resources-ms"
  RESOURCES_MS_PORT: "8080"
  SONGS_MS_URL: "songs-service"
  SONGS_MS_PORT: "8081"
  EUREKA_URI: "eureka-server"
  ENABLE_EUREKA_CLIENT: "true"
  RESOURCES_DB_URL: "resources-db"
  RESOURCES_DB_PORT: "5432"
  SONGS_MS_NAME: "songs-ms"
  SONGS_DB_URL: "songs-db"
  SONGS_DB_PORT: "5432"
  SPRING_DATASOURCE_URL_RESOURCES: "jdbc:postgresql://resources-db:5432/resources"
  SPRING_DATASOURCE_URL_SONGS: "jdbc:postgresql://songs-db:5432/songs"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: k8s-program
data:
  init-resources.sql: |
    CREATE TABLE IF NOT EXISTS resources (
        id SERIAL PRIMARY KEY,
        blob BYTEA
    );
  init-songs.sql: |
    CREATE TABLE IF NOT EXISTS songs (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255),
        artist VARCHAR(255),
        album VARCHAR(255),
        length VARCHAR(255),
        resource_id INTEGER UNIQUE NOT NULL,
        year VARCHAR(255),
        genre VARCHAR(255)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: resources-service
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: resources-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: songs-service
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: songs-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: resources-db
  namespace: k8s-program
spec:
  type: ClusterIP
  selector:
    app: resources-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: songs-db
  namespace: k8s-program
spec:
  type: ClusterIP
  selector:
    app: songs-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-service
  namespace: k8s-program
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resources-service
  template:
    metadata:
      labels:
        app: resources-service
    spec:
      containers:
        - name: resources-service
          image: resources-image:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          livenessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL_RESOURCES
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
      initContainers:
        - name: wait-for-resources-db
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              until pg_isready -h resources-db -p 5432 -U postgres; do
                echo "waiting for resources-db..."
                sleep 2
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-service
  namespace: k8s-program
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: songs-service
  template:
    metadata:
      labels:
        app: songs-service
    spec:
      containers:
        - name: songs-service
          image: songs-image:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          livenessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL_SONGS
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          volumeMounts:
            - name: songs-storage
              mountPath: /data
      initContainers:
        - name: wait-for-songs-db
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              until pg_isready -h songs-db -p 5432 -U postgres; do
                echo "waiting for songs-db..."
                sleep 2
              done
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resources-db
  namespace: k8s-program
spec:
  serviceName: resources-db
  replicas: 1
  selector:
    matchLabels:
      app: resources-db
  template:
    metadata:
      labels:
        app: resources-db
    spec:
      containers:
        - name: resources-db
          image: postgres:16
          ports:
            - containerPort: 5432
          livenessProbe:
            timeoutSeconds: 10
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            timeoutSeconds: 10
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            timeoutSeconds: 10
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: POSTGRES_DB
              value: resources
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: db-init-scripts
            items:
              - key: init-resources.sql
                path: init-resources.sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
